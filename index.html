<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manos y partículas</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Lienzo de Three.js (ocupa toda la pantalla) -->
  <canvas id="escena"></canvas>

  <!-- Webcam en miniatura (entrada de MediaPipe) con el esqueleto de las manos encima -->
  <div id="camara" hidden>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="manos"></canvas>
  </div>

  <!-- Panel de estado / depuración -->
  <div id="hud">
    <button id="btn-iniciar">Activar cámara</button>
    <span id="estado">Esperando…</span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
